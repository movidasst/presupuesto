name: Fix mobile header actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-header.yml'

permissions:
  contents: write

jobs:
  fix-mobile-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply responsive header fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '/* Mobile header hardening */'
          if marker not in s:
              anchor = '    .header-cta { display: none; }\n'
              addition = '''    .header-cta { display: none; }\n\n    /* Mobile header hardening */\n    @media (max-width: 959px) {\n      .nav { gap: 8px; }\n      .brand { flex: 1 1 auto; max-width: calc(100% - 54px); gap: 9px; overflow: hidden; }\n      .brand__text { overflow: hidden; }\n      .brand__name, .brand__tagline { overflow: hidden; text-overflow: ellipsis; }\n      .brand__name { white-space: nowrap; }\n      .brand__tagline { max-width: 250px; }\n      .nav-actions { flex: 0 0 auto; gap: 0; }\n      #headerPrintBtn, .header-cta { display: none !important; }\n      .menu-toggle { display: inline-grid !important; }\n    }\n    @media (max-width: 430px) {\n      .brand__logo { width: 42px; height: 42px; }\n      .brand__name { font-size: .91rem; }\n      .brand__tagline { font-size: .61rem; max-width: 190px; }\n    }\n    @media (max-width: 360px) {\n      .brand__tagline { display: none; }\n    }\n'''
              if anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(anchor, addition, 1)

          if '.mobile-menu__action {' not in s:
              anchor = '''    .mobile-menu .mobile-menu__cta {\n      margin-top: 14px; justify-content: center; background: var(--brand); color: #fff;\n      border: 0; border-radius: 14px; padding: 0 16px;\n    }\n'''
              addition = anchor + '''    .mobile-menu__action {\n      width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px;\n      padding: 0 8px; border: 0; border-bottom: 1px solid #edf1f4; background: transparent;\n      color: #243854; font-weight: 750; text-align: left; cursor: pointer;\n    }\n    .mobile-menu__action span { display: inline-flex; align-items: center; gap: 9px; }\n    .mobile-menu__action i:first-child { color: var(--brand); }\n'''
              if anchor not in s:
                  raise SystemExit('Mobile menu CSS anchor not found')
              s = s.replace(anchor, addition, 1)

          if 'id="mobilePrintBtn"' not in s:
              anchor = '''      <a href="#condiciones">Condiciones <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></a>\n      <a class="mobile-menu__cta"'''
              replacement = '''      <a href="#condiciones">Condiciones <i class="fa-solid fa-chevron-right" aria-hidden="true"></i></a>\n      <button class="mobile-menu__action" id="mobilePrintBtn" type="button">\n        <span><i class="fa-solid fa-file-pdf" aria-hidden="true"></i> Generar propuesta / PDF</span>\n        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>\n      </button>\n      <a class="mobile-menu__cta"'''
              if anchor not in s:
                  raise SystemExit('Mobile menu HTML anchor not found')
              s = s.replace(anchor, replacement, 1)

          if "const mobilePrintBtn = document.getElementById('mobilePrintBtn');" not in s:
              anchor = "      const budgetPrintBtn = document.getElementById('budgetPrintBtn');\n"
              replacement = anchor + "      const mobilePrintBtn = document.getElementById('mobilePrintBtn');\n"
              if anchor not in s:
                  raise SystemExit('JS const anchor not found')
              s = s.replace(anchor, replacement, 1)

          if "mobilePrintBtn?.addEventListener('click'" not in s:
              anchor = "      headerPrintBtn?.addEventListener('click', printBudgetProposal);\n      budgetPrintBtn?.addEventListener('click', printBudgetProposal);\n"
              replacement = anchor + "      mobilePrintBtn?.addEventListener('click', () => { setMenu(false); printBudgetProposal(); });\n"
              if anchor not in s:
                  raise SystemExit('JS listener anchor not found')
              s = s.replace(anchor, replacement, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "movidasst"
          git config user.email "gdochile@gmail.com"
          git rm .github/workflows/fix-mobile-header.yml
          git add index.html
          git commit -m "Fix mobile header actions"
          git push
