name: Add administration access

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_admin_access.py'
      - '.github/workflows/add-admin-access.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add admin links
        run: python .github/scripts/add_admin_access.py
      - name: Commit application change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: restore administration access button'
          git push origin main
