name: Finalize corporate quote project

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/connect_presupuesto_config.py'
      - '.github/workflows/connect-presupuesto-config.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final cleanup
        run: python .github/scripts/connect_presupuesto_config.py
      - name: Validate JavaScript
        run: |
          node --check presupuesto-config.js
          node --check presupuesto-leads.js
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('index.html','admin.html'):
              text=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',text,re.I)
              for i,code in enumerate(scripts):
                  if not code.strip() or code.lstrip().startswith('{'): continue
                  p=Path(f'/tmp/{name}-{i}.js')
                  p.write_text(code,encoding='utf-8')
                  print(p)
          PY
          for f in /tmp/index.html-*.js /tmp/admin.html-*.js; do
            [ -e "$f" ] && node --check "$f"
          done
      - name: Commit application changes
        run: |
          # A workflow token cannot create another workflow. Restore this
          # temporary workflow and discard validate.yml here; ChatGPT will
          # install validate.yml directly after this migration succeeds.
          git checkout HEAD -- .github/workflows/connect-presupuesto-config.yml
          rm -f .github/workflows/validate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'chore: finalize corporate quote architecture'
            git push origin main
          fi
