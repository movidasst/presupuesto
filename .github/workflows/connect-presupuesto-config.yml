name: Apply total presupuesto upgrade

on:
  push:
    paths:
      - '.github/workflows/connect-presupuesto-config.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply total B2B upgrade
        run: python .github/scripts/connect_presupuesto_config.py
      - name: Extract and validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for source, target in [('index.html','/tmp/index-app.js'),('admin.html','/tmp/admin-app.js')]:
              text=Path(source).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
              inline=[s for s in scripts if s.strip() and not s.lstrip().startswith('{')]
              if not inline: raise SystemExit(f'No inline application script found in {source}')
              Path(target).write_text(inline[-1],encoding='utf-8')
          PY
          node --check /tmp/index-app.js
          node --check /tmp/admin-app.js
          node --check presupuesto-config.js
          node --check presupuesto-leads.js
      - name: Verify upgrade markers
        run: |
          grep -q 'id="leadCapture"' index.html
          grep -q 'id="structuredData"' index.html
          grep -q 'id="printCompany"' index.html
          grep -q 'id="printValidity"' index.html
          grep -q 'presupuesto-leads.js' index.html
          grep -q 'Cohorte Corporativa' index.html
          grep -q 'Ejemplo de cohorte corporativa' index.html
          grep -q 'Valor claro para quienes deciden' index.html
          grep -q 'budgetLiveStatus' index.html
          ! grep -q 'budgetSavings' index.html
          ! grep -q 'printListTotal' index.html
          ! grep -q 'Ahorro vs. tarifa lista' index.html
      - name: Commit production page
        run: |
          git config user.name "movidasst"
          git config user.email "gdochile@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Upgrade corporate proposal UX and lead capture"
            git push origin main
          fi
