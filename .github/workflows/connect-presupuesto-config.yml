name: Connect presupuesto admin config

on:
  push:
    paths:
      - '.github/workflows/connect-presupuesto-config.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply configuration integration
        run: python .github/scripts/connect_presupuesto_config.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for source, target in [('index.html','/tmp/index-app.js'),('admin.html','/tmp/admin-app.js'),('presupuesto-config.js','/tmp/config-app.js')]:
              text=Path(source).read_text(encoding='utf-8')
              if source.endswith('.html'):
                  scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S)
                  inline=[s for s in scripts if s.strip()]
                  if not inline: raise SystemExit(f'No inline script found in {source}')
                  Path(target).write_text(inline[-1],encoding='utf-8')
              else:
                  Path(target).write_text(text,encoding='utf-8')
          PY
          node --check /tmp/index-app.js
          node --check /tmp/admin-app.js
          node --check /tmp/config-app.js
      - name: Verify integration markers
        run: |
          grep -q 'presupuesto-config.js' index.html
          grep -q 'PresupuestoConfig.getTier' index.html
          grep -q 'PresupuestoConfig.calculate' index.html
          grep -q 'admin.html' index.html
          grep -q 'admin_presupuesto_config_guardar' admin.html
      - name: Commit integration
        run: |
          git config user.name "movidasst"
          git config user.email "gdochile@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Connect presupuesto to protected admin configuration"
            git push origin main
          fi
