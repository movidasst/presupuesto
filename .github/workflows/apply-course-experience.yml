name: Apply course experience content

on:
  push:
    paths:
      - '.github/workflows/apply-course-experience.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply course experience patch
        run: python .github/scripts/add_course_experience.py
      - name: Commit course experience
        run: |
          git config user.name "movidasst"
          git config user.email "gdochile@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add practical gamified course experience section"
            git push origin main
          fi
