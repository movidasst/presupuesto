name: Apply mobile SPA navigation

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-spa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply mobile SPA patch
        run: python .github/scripts/apply_mobile_spa.py
      - name: Commit mobile SPA
        run: |
          git config user.name "movidasst"
          git config user.email "gdochile@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Convert phone UX to tabbed SPA navigation"
            git push origin main
          fi
